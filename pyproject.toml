[project]
name = "ai-103"
version = "0.1.0"
description = "Local-first Adaptive Learning Orchestrator for AI-103 study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-contentunderstanding>=1.0.0b1",
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.25.1",
    "azure-search-documents>=11.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "responses>=0.25.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "-m",
    "not live_azure",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: offline unit tests",
    "integration: offline integration tests",
    "contract: schema and compatibility contract tests",
    "eval: learning-content and tutor quality evaluation tests",
    "live_azure: tests that deploy or call live Azure services",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
